        <h1>ErasMatch — Connect with Erasmus Students Before You Arrive</h1>
        <p>Meet your future Erasmus crew before you fly. Find study buddies, join city group chats, and make friends for your exchange experience. 1,000+ students have already joined from 50+ countries.</p>

        <h2>Why ErasMatch?</h2>
        <ul>
          <li><strong>Find your future flatmate</strong> — See who's heading to your city the same semester. Most students find their flatmate or travel buddy within a day of signing up.</li>
          <li><strong>Get real answers, not Google results</strong> — Ask alumni who actually lived there about housing, transport, and neighbourhoods.</li>
          <li><strong>Know people before you land</strong> — Swap Instagrams, plan your first week, and arrive with friends instead of strangers.</li>
        </ul>

        <h2>How it works</h2>
        <ol>
          <li><strong>Tell us where you're going</strong> — Add your host city, destination university and semester.</li>
          <li><strong>Land in your group chats</strong> — You're instantly added to the group chats for your destination city and university.</li>
          <li><strong>Filter, find, and message</strong> — Browse profiles by city, university and semester, then DM the students you want to connect with.</li>
        </ol>
